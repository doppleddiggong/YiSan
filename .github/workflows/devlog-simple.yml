name: Daily DevLog (Simple)

on:
  # 매일 KST 기준 오전 9시에 실행 (UTC 00:00)
  schedule:
    - cron: '0 0 * * *'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      date:
        description: '생성할 날짜 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 가져오기

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install jinja2 pyyaml

      - name: Get current date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "today=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/devlog/generate_daily.py
          chmod +x .github/scripts/devlog/update_summary.py

      - name: Generate Daily DevLog
        run: |
          python .github/scripts/devlog/generate_daily.py \
            --since "24 hours" \
            --branch "${{ steps.date.outputs.branch }}" \
            --base "origin/main" \
            --out "Documents/DevLog/${{ steps.date.outputs.today }}.md"

      - name: Create empty metrics file
        run: |
          if [ ! -f "Documents/DevLog/${{ steps.date.outputs.today }}.metrics.json" ]; then
            echo '{}' > "Documents/DevLog/${{ steps.date.outputs.today }}.metrics.json"
          fi

      - name: Update SUMMARY.md
        run: |
          python .github/scripts/devlog/update_summary.py Documents

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Documents/DevLog/*.md Documents/DevLog/*.json Documents/SUMMARY.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(devlog): daily devlog ${{ steps.date.outputs.today }}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          fi

      - name: Send Discord Notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL secret이 설정되지 않았습니다. Discord 알림을 건너뜁니다."
          else
            chmod +x .github/scripts/devlog/send_discord.py
            python .github/scripts/devlog/send_discord.py \
              --webhook-url "$DISCORD_WEBHOOK_URL" \
              --type "daily" \
              --devlog-file "Documents/DevLog/${{ steps.date.outputs.today }}.md" \
              --date "${{ steps.date.outputs.today }}" \
              --devlog-url "https://doppleddiggong.github.io/YiSan/docs/DevLog/${{ steps.date.outputs.today }}.html"
          fi

      - name: Summary
        run: |
          echo "✅ Daily DevLog has been generated!"
          echo "📅 Date: ${{ steps.date.outputs.today }}"
          echo "📝 File: Documents/DevLog/${{ steps.date.outputs.today }}.md"
          echo "🔗 URL: https://doppleddiggong.github.io/YiSan/docs/DevLog/${{ steps.date.outputs.today }}.html"
