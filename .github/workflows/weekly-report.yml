name: Weekly DevLog Report

on:
  # 매주 일요일 KST 오후 11시 (UTC 14:00)
  schedule:
    - cron: '0 14 * * 0'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      date:
        description: '기준 날짜 (YYYY-MM-DD, 비워두면 이번 주)'
        required: false
        type: string
      use_gpt:
        description: 'GPT 주간 성장 피드백 사용'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 가져오기

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load config
        id: config
        run: |
          # config.yml에서 설정 읽기
          WEEKLY_GPT_ENABLED=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['gpt']['weekly_enabled'])")
          DISCORD_ENABLED=$(python3 -c "import yaml; print(yaml.safe_load(open('.github/config.yml'))['discord']['enabled'])")

          echo "weekly_gpt_enabled=$WEEKLY_GPT_ENABLED" >> $GITHUB_OUTPUT
          echo "discord_enabled=$DISCORD_ENABLED" >> $GITHUB_OUTPUT

          # 수동 실행 시 입력값이 우선, 그 외엔 config 값 사용
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.use_gpt }}" ]; then
            USE_GPT="${{ github.event.inputs.use_gpt }}"
          else
            USE_GPT="$WEEKLY_GPT_ENABLED"
          fi

          echo "use_gpt=$USE_GPT" >> $GITHUB_OUTPUT
          echo "📋 Config loaded: weekly_gpt=$WEEKLY_GPT_ENABLED, use_gpt=$USE_GPT"

      - name: Install Python dependencies
        run: |
          pip install jinja2 pyyaml
          if [ "${{ steps.config.outputs.use_gpt }}" == "true" ] || [ "${{ steps.config.outputs.use_gpt }}" == "True" ]; then
            pip install openai
          fi

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/devlog/generate_weekly.py
          chmod +x .github/scripts/devlog/update_summary.py

      - name: Generate Weekly Report
        id: weekly
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          else
            DATE_ARG=""
          fi

          # 주차 계산
          if [ -n "${{ github.event.inputs.date }}" ]; then
            WEEK_LABEL=$(python3 -c "import datetime; d=datetime.datetime.strptime('${{ github.event.inputs.date }}', '%Y-%m-%d').date(); m=d-datetime.timedelta(days=d.weekday()); print(f'{m.year}-W{m.isocalendar()[1]:02d}')")
          else
            WEEK_LABEL=$(python3 -c "import datetime; d=datetime.date.today(); m=d-datetime.timedelta(days=d.weekday()); print(f'{m.year}-W{m.isocalendar()[1]:02d}')")
          fi

          echo "week_label=$WEEK_LABEL" >> $GITHUB_OUTPUT

          python .github/scripts/devlog/generate_weekly.py \
            $DATE_ARG \
            --devlog-dir "Documents/DevLog" \
            --out "Documents/DevLog/${WEEK_LABEL}-Summary.md"

      - name: Generate GPT Weekly Feedback (Optional)
        if: steps.config.outputs.use_gpt == 'true' || steps.config.outputs.use_gpt == 'True'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          chmod +x .github/scripts/devlog/generate_weekly_feedback.py
          python .github/scripts/devlog/generate_weekly_feedback.py \
            --weekly-file "Documents/DevLog/${{ steps.weekly.outputs.week_label }}-Summary.md" \
            --devlog-dir "Documents/DevLog" \
            --week-label "${{ steps.weekly.outputs.week_label }}" \
            --output "Documents/DevLog/${{ steps.weekly.outputs.week_label }}-feedback.md"

      - name: Merge Weekly Report and Feedback
        if: steps.config.outputs.use_gpt == 'true' || steps.config.outputs.use_gpt == 'True'
        run: |
          BASE_FILE="Documents/DevLog/${{ steps.weekly.outputs.week_label }}-Summary.md"
          FEEDBACK_FILE="Documents/DevLog/${{ steps.weekly.outputs.week_label }}-feedback.md"

          if [ -f "$FEEDBACK_FILE" ]; then
            cat "$FEEDBACK_FILE" >> "$BASE_FILE"
            rm "$FEEDBACK_FILE"
            echo "✅ GPT weekly feedback merged"
          fi

      - name: Update SUMMARY.md
        run: |
          python .github/scripts/devlog/update_summary.py Documents

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Documents/DevLog/*.md Documents/SUMMARY.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(devlog): weekly report ${{ steps.weekly.outputs.week_label }}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          fi

      - name: Send Discord Notification
        if: success() && (steps.config.outputs.discord_enabled == 'true' || steps.config.outputs.discord_enabled == 'True')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL secret이 설정되지 않았습니다. Discord 알림을 건너뜁니다."
          else
            chmod +x .github/scripts/devlog/send_discord.py
            python .github/scripts/devlog/send_discord.py \
              --webhook-url "$DISCORD_WEBHOOK_URL" \
              --type "weekly" \
              --devlog-file "Documents/DevLog/${{ steps.weekly.outputs.week_label }}-Summary.md" \
              --date "${{ steps.weekly.outputs.week_label }}" \
              --devlog-url "https://doppleddiggong.github.io/YiSan/docs/DevLog/${{ steps.weekly.outputs.week_label }}-Summary.html"
          fi

      - name: Summary
        run: |
          echo "✅ Weekly DevLog Report has been generated!"
          echo "📅 Week: ${{ steps.weekly.outputs.week_label }}"
          echo "📝 File: Documents/DevLog/${{ steps.weekly.outputs.week_label }}-Summary.md"
          echo "🔗 URL: https://doppleddiggong.github.io/YiSan/docs/DevLog/${{ steps.weekly.outputs.week_label }}-Summary.html"
